# ~/.config/tmux/tmux.conf

# ── General ─────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # true color (Neovim themes look right)
set -g mouse on
set -g base-index 1                # windows start at 1
setw -g pane-base-index 1          # panes start at 1
set -g renumber-windows on         # close window 2 of 3 → window 3 becomes 2
set -g history-limit 50000
set -sg escape-time 10             # no Esc delay in Neovim
set -g focus-events on             # Neovim autoread works inside tmux
set -g set-clipboard on            # copy over SSH lands in your Windows clipboard (OSC 52)

# ── Keybindings ─────────────────────────────────────────────
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits open in the current pane's folder
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Copy mode (vi keys)
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Resize panes (hold prefix, tap repeatedly)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Zoom current pane
bind m resize-pane -Z

# Session picker (built-in; replaces tmux-sessionx)
bind o choose-tree -Zs

# ── Plugins (TPM) ───────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl+h/j/k/l moves between Neovim and tmux panes
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'rose-pine/tmux'

# Resurrect + Continuum: auto-save every 15 min, auto-restore on start
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# ── Theme: Rosé Pine ────────────────────────────────────────
set -g status-position bottom
set -g @rose_pine_variant 'main'
set -g @rose_pine_directory 'on'    # current folder on the left
set -g @rose_pine_host 'on'         # hostname, so you can tell "macmini" from your laptop at a glance
# ↓ paste your custom separators / icons / window formats from the old file here
#   (skip anything mentioning online_status)

# ── Install TPM automatically on a new machine ──────────────
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Keep this line last
run '~/.config/tmux/plugins/tpm/tpm'
